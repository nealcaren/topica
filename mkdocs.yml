site_name: Topica
site_description: Fast, all-purpose topic modeling for Python — a Rust core with the MALLET, STM, tomotopy, and gensim toolkits in one package.
site_url: https://nealcaren.github.io/topica/
repo_url: https://github.com/nealcaren/topica
repo_name: nealcaren/topica
edit_uri: ""

theme:
  name: material
  logo: images/topica-mark.svg
  favicon: images/topica-favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            force_inspection: true
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Start here:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Choose an approach: can-do/index.md
      - Agent cheat sheet: guides/agent-cheatsheet.md
  - From corpus to credible result:
      - Overview: publishing/index.md
      - 1. Build a defensible corpus: publishing/corpus.md
      - 2. Pick the right model: publishing/choosing-model.md
      - 3. Choose and justify K: publishing/choosing-k.md
      - 4. Validate the topics: publishing/validation.md
      - 5. Measure effects properly: publishing/effects.md
      - 6. Report and make reproducible: publishing/reporting.md
  - Methods & models:
      - The model catalog: guides/models.md
      - Comparing the models: guides/model-comparison.md
      - Covariates & STM: guides/covariates.md
      - Guided topics (seed words): guides/guided.md
      - Short text: guides/short-text.md
      - Embedding topics: guides/embedding.md
      - LLM-based topics: guides/llm.md
  - Analyze & validate:
      - Preprocessing: guides/preprocessing.md
      - Diagnostics & validation: guides/diagnostics.md
      - Reporting uncertainty: guides/uncertainty.md
      - Visualization: guides/visualization.md
      - Distinguishing words: guides/keywords.md
      - Held-out inference: guides/transform.md
      - Cross-validation: guides/cross-validation.md
  - Benchmarks: benchmarks.md
  - Examples:
      - Du Bois in The Crisis: examples/dubois.md
      - Congress (STM party & time): examples/congress.md
      - Political blogs: examples/poliblog.md
      - Party platforms (STM content_time): examples/content_time.md
      - NMF vs neural (labeled): examples/nmf-neural.md
      - Guided topics (keyATM): examples/guided.md
      - Sentiment covariate (DMR): examples/dmr-sentiment.md
      - Short text (GSDMM/BTM): examples/short-text.md
      - Threaded conversations (ThreadTM): examples/threads.md
      - LLM embeddings & labels: examples/llm-topics.md
  - Replications:
      - Overview: replications/index.md
      - STM (the stm vignette): replications/stm.md
      - Dynamic keyATM (Supreme Court): replications/keyatm-dynamic.md
      - TensorLDA validation: replications/tlda.md
      - STS reference profiles: replications/sts.md
  - API reference:
      - Datasets: api/datasets.md
      - Models: api/models.md
      - Embedding models: api/embedding.md
      - Diagnostics: api/diagnostics.md
      - Analysis manifest: api/manifest.md
      - Content-covariate diagnostics: api/content.md
      - Visualization: api/viz.md
      - STM toolkit: api/stm.md
      - keyATM toolkit: api/keyatm.md
      - Keywords & preprocessing: api/keywords.md
  - Contributing:
      - API conventions: contributing/conventions.md
      - Estimator contract: contributing/estimator-contract.md
      - Model implementation map: contributing/model-map.md
      - Validation & graduation: contributing/validation.md
      - Release checklist: contributing/release-checklist.md
  - Citing: citing.md
