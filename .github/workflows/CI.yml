# CI for topica — a PyO3/maturin package producing abi3 wheels.
#
# Jobs:
#   test        — build in dev mode & run pytest on Linux, macOS, Windows
#   build-wheels — produce abi3 wheels for all target platforms
#   sdist       — produce a source distribution
#   release     — publish to PyPI on tag push v*
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token / secret.
# One-time setup on PyPI: add a trusted publisher for project "topica"
# (owner nealcaren, repo topica, workflow CI.yml, environment pypi).

name: CI

on:
  push:
    branches: [main]
    tags:    ["v*"]
  pull_request:
  workflow_dispatch:

# Minimal permissions by default; individual jobs override as needed.
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Job: test
# Builds the extension in-place with `maturin develop` and runs pytest.
# Matrix covers the three major platforms; a single Python version suffices
# because the wheel is abi3 (CPython >=3.9 compatible).
# ---------------------------------------------------------------------------
jobs:
  # A tag is the immutable public statement of the version. Refuse to publish
  # if either package manifest disagrees with it.
  release-version:
    name: release version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag and manifests agree
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$tag" = "$py_version"
          test "$tag" = "$cargo_version"

  # Rust hygiene gate, run once (OS-independent): the whole workspace must be
  # rustfmt-clean and clippy-clean (-D warnings, all features so the src/python/
  # bindings are linted too). Catches drift without relying on reviewer discipline.
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # Install stable Rust toolchain (required for maturin/pyo3 compilation).
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Cache the cargo registry and target/ across runs so the release compile
      # is paid once and reused, not rebuilt cold every time.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `maturin develop` requires an active virtualenv, so create one and use
      # it for the build + test. A single bash step keeps the venv activated
      # across the build and test commands (activation does not persist between
      # steps). `shell: bash` selects Git bash on Windows, so the same
      # activation path logic works on all three platforms.
      #
      # --release: the Gibbs/EM loops are an order of magnitude slower in a debug
      # build, and the suite is dominated by model fits, so an optimized build
      # turns a ~20-minute debug run into a few minutes. The extra compile time is
      # repaid many times over (and cached by rust-cache above).
      # Rust unit tests. Run without the `python` feature: pyo3's
      # extension-module mode does not link libpython into a standalone test
      # binary, so the bindings crate cannot be unit-tested that way. `--workspace`
      # so the extracted `topica-core` member is tested too, not just the root
      # crate (otherwise the core can regress while CI stays green). Covers the
      # core/model/saveformat tests. Cheap and cached; part of the test contract
      # in CONTRIBUTING.md, so it gates PRs here too.
      - name: cargo test
        run: cargo test --workspace --lib

      # Feature-gated Rust tests (issue #383). The bare run above does not compile
      # the `embeddings`/`umap`/`tsne` code, so tests behind those `#[cfg(feature
      # = ...)]` gates never run. Enable them explicitly. NOT `--all-features`:
      # that would also turn on `python`, and pyo3's extension-module mode does
      # not link libpython into a standalone test binary (see above). This set
      # covers every feature gate except `python`, which has no unit-testable
      # code. Also in CONTRIBUTING.md as `cargo test --features embeddings,umap,tsne`.
      - name: cargo test (feature-gated models)
        run: cargo test --workspace --lib --features embeddings,umap,tsne

      - name: Build extension and run tests
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/bin/activate ]; then source .venv/bin/activate; else source .venv/Scripts/activate; fi
          python -m pip install --upgrade pip
          # Install the full test extra (scipy/plotly) plus polars so the viz
          # and DataFrame surfaces are exercised, not silently importorskip-ed.
          pip install maturin numpy pytest pandas formulaic matplotlib scipy plotly polars
          maturin develop --release --features python
          pytest -q

      # Offline-gold guard (issue #271): the committed gold-fixture tests must
      # validate topica WITHOUT importing any reference toolchain (torch, sklearn,
      # bertopic, ...) — those are regenerate-time only and are not installed here.
      # `pytest -q` above already runs them in this reference-free venv, but this
      # step additionally hard-blocks the reference packages at import so the rule
      # holds even if the environment later gains one (it bit us once: a gold test
      # reached for sklearn and turned main red). Ubuntu only — one run suffices.
      - name: Offline-gold guard
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          source .venv/bin/activate
          python scripts/ci_sim.py tests/test_*_gold.py

  # ---------------------------------------------------------------------------
  # Job: docs
  # Builds the mkdocs site with --strict on Linux, so a broken nav entry, a dead
  # cross-reference, or a mkdocstrings import failure fails the PR instead of
  # silently deploying. (Deploy itself happens in docs.yml on push to main.)
  # ---------------------------------------------------------------------------
  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # mkdocstrings imports topica to render the API reference, so the
      # extension must be built into the environment before the docs build.
      # maturin develop needs an active virtualenv, so create and activate one.
      - name: Build extension and docs
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin
          pip install -r docs/requirements.txt
          maturin develop --release --features python
          mkdocs build --strict

  # ---------------------------------------------------------------------------
  # Job: build-wheels
  # Produces abi3 wheels. Because the wheel is abi3 (tagged cp39-abi3-*), one
  # build per platform target is sufficient — no Python version matrix needed.
  #
  # maturin-action handles QEMU setup automatically for aarch64-linux and
  # invokes maturin inside the appropriate manylinux container for Linux.
  # ---------------------------------------------------------------------------
  build-wheels:
    name: wheel / ${{ matrix.target }}
    # Wheels are only consumed by the release job, so build them at release time
    # (a v* tag) or on demand, not on every push/PR. Day-to-day validation is the
    # `test` job above.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux x86_64 (manylinux) ----
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto

          # ---- Linux aarch64 (manylinux, cross-compiled via QEMU) ----
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto

          # ---- macOS x86_64 ----
          - os: macos-latest
            target: x86_64
            manylinux: ""

          # ---- macOS aarch64 (Apple Silicon) ----
          - os: macos-latest
            target: aarch64
            manylinux: ""

          # ---- Windows x64 ----
          - os: windows-latest
            target: x64
            manylinux: ""

    steps:
      - uses: actions/checkout@v5

      # maturin-action provides Rust toolchain internally; explicit install not
      # needed here, but setup-python IS needed so maturin can find an interpreter
      # for the abi3 wheel stub.
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # manylinux is only meaningful on Linux legs; empty string on others.
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # --release: optimised build; --out dist: place wheel in dist/;
          # --features python: enable pyo3/numpy deps (see Cargo.toml).
          args: --release --out dist --features python
          # Rust source is at the repo root.
          working-directory: .

      # Exercise the actual wheel, rather than only the in-place development
      # extension. Cross-compiled wheels are built here but cannot run on this
      # runner, so smoke-test each native architecture.
      - name: Smoke-test native wheel
        if: >-
          (matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64') ||
          (matrix.os == 'macos-latest' && matrix.target == 'aarch64') ||
          (matrix.os == 'windows-latest' && matrix.target == 'x64')
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import topica; print(topica.__version__)"

      # Upload each leg's wheel as a separate artifact so the release job can
      # download them all cleanly.
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job: sdist
  # Produces a source distribution (required for a complete PyPI release).
  # ---------------------------------------------------------------------------
  sdist:
    name: sdist
    # Like the wheels, the sdist is only needed for a release; build it on a v*
    # tag or on demand, not on every push/PR.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        shell: bash
        run: |
          # A source release must exactly represent the tagged checkout. This
          # prevents an accidental manual release from bundling local notes or
          # scratch files that maturin would otherwise discover.
          test -z "$(git status --porcelain)"
          maturin sdist --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job: release
  # Runs only when a version tag (v*) is pushed.
  # Downloads all wheel + sdist artifacts and publishes to PyPI via Trusted
  # Publishing (OIDC) — no stored token. Requires the one-time PyPI setup noted
  # at the top of this file.
  # ---------------------------------------------------------------------------
  release:
    name: release (PyPI)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Publishing is a terminal action: no PyPI artifact is released unless
    # every lint, native test, documentation, and packaging gate succeeded.
    needs: [release-version, lint, test, docs, build-wheels, sdist]

    # PyPI Trusted Publishing (OIDC): no API token needed. The id-token
    # permission lets GitHub mint a short-lived OIDC token that PyPI trades for
    # an upload credential, based on the trusted-publisher entry you configure
    # on PyPI (project: topica, owner: nealcaren, repo: topica, workflow:
    # CI.yml, environment: pypi). See README / docs for the one-time setup.
    permissions:
      contents: read
      id-token: write

    # Binding the job to a named environment lets you add approval gates on
    # PyPI publishes and is the environment referenced in the PyPI config.
    environment:
      name: pypi
      url: https://pypi.org/p/topica

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          # Download every artifact produced above into dist/.
          path: dist
          merge-multiple: true

      - name: List dist contents
        run: ls -lh dist/

      # Trusted Publishing: the action detects the OIDC token from the
      # id-token permission above and uploads without any stored secret.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Job: cli-release
  # Build and attach the standalone CLI only after the same complete release
  # gate that protects the PyPI artifacts. Keeping this in CI.yml avoids the
  # race caused by a separate tag-triggered publishing workflow.
  # ---------------------------------------------------------------------------
  cli-release:
    name: CLI release / ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-version, lint, test, docs, build-wheels, sdist]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          STAGING="topica-cli-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$STAGING"
          for bin in preprocess analyze train show; do
            cp "target/${{ matrix.target }}/release/$bin" "$STAGING/"
          done
          cp README.md "$STAGING/"
          cp -r examples "$STAGING/"
          tar -czf "$STAGING.tar.gz" "$STAGING"
          echo "ASSET=$STAGING.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $staging = "topica-cli-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $staging
          foreach ($bin in @('preprocess','analyze','train','show')) {
            Copy-Item "target/${{ matrix.target }}/release/$bin.exe" "$staging/"
          }
          Copy-Item README.md "$staging/"
          Copy-Item -Recurse examples "$staging/"
          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip"
          echo "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
